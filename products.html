<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <title>Tradelite Admin - Products</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2 {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
    <aside class="h-screen w-64 fixed left-0 top-0 bg-white border-r z-40 hidden md:block">
        <div class="p-8">
            <h1 class="text-2xl font-black text-blue-900">Tradelite</h1>
        </div>
        <nav class="px-4 space-y-1">
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="javascript:void(0)" onclick="navTo('admin-dashboard')">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <a class="bg-blue-50 text-blue-700 font-bold px-4 py-3 flex items-center gap-3 rounded-lg"
                href="javascript:void(0)" onclick="navTo('products')">
                <span class="material-symbols-outlined">inventory_2</span> Products
            </a>
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="javascript:void(0)" onclick="navTo('order-management')">
                <span class="material-symbols-outlined">shopping_cart</span> Orders
            </a>
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="javascript:void(0)" onclick="navTo('employees')">
                <span class="material-symbols-outlined">badge</span> Employees
            </a>
        </nav>
    </aside>

    <main class="md:pl-64 pt-8 px-8">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-4xl font-black tracking-tight">Product Inventory</h1>
                    <p class="text-slate-500">Manage your business assets across all categories.</p>
                </div>
                <a href="javascript:void(0)" onclick="navTo('add-newproduct')"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold shadow-lg hover:bg-blue-700 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined">add</span> Add New Product
                </a>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500">Product</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500">Category</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-right">Price</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-center">Stock</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-slate-400">Loading inventory data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9eGV7dXzy0e-mTuMdC0Lv98zlfGOyvIDX0Q7zNk3ftCj__nIhuEuVBkgp3MklkEbW/exec";

        // Smart navigation: works in localhost and GAS
        function navTo(page) {
            if (window.location.hostname === 'localhost' || window.location.protocol === 'file:') {
                window.location.href = page + '.html';
            } else {
                // Use window.top to break out of GAS iframe
                window.top.location.href = APPS_SCRIPT_URL + '?page=' + page;
            }
        }

        async function loadProducts() {
            const list = document.getElementById('product-list');
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getProducts`);
                const json = await res.json();
                const products = json.data || [];

                list.innerHTML = '';
                if (products.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="py-10 text-center">No products found.</td></tr>';
                    return;
                }

                products.forEach(p => {
                    list.innerHTML += `
                        <tr class="border-b hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-slate-100 rounded border flex items-center justify-center overflow-hidden">
                                        ${p.images && p.images[0] ? `<img src="${p.images[0]}" class="object-cover w-full h-full" />` : '<span class="material-symbols-outlined text-slate-400">image</span>'}
                                    </div>
                                    <span class="font-bold">${p.name}</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-500 font-medium">${p.category}</td>
                            <td class="px-6 py-4 text-right font-bold text-blue-900">₹${p.price}</td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-2 py-1 rounded-full text-[11px] font-black uppercase ${p.availability.toLowerCase().includes('out') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                                    ${p.availability}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-slate-400 hover:text-blue-600 transition-colors">
                                    <span class="material-symbols-outlined">edit_square</span>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                list.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-red-500 font-bold">Failed to load system data.</td></tr>';
            }
        }
        window.onload = loadProducts;
    </script>
</body>

</html>
