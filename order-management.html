<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <title>Tradelite Admin - Orders</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2 {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
    <aside class="h-screen w-64 fixed left-0 top-0 bg-white border-r z-40 hidden md:block">
        <div class="p-8">
            <h1 class="text-2xl font-black text-orange-600">Tradelite</h1>
        </div>
        <nav class="px-4 space-y-1">
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="<?= getPageUrl('admin-dashboard') ?>">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="<?= getPageUrl('products') ?>">
                <span class="material-symbols-outlined">inventory_2</span> Products
            </a>
            <a class="bg-orange-50 text-orange-600 font-bold px-4 py-3 flex items-center gap-3 rounded-lg"
                href="<?= getPageUrl('order-management') ?>">
                <span class="material-symbols-outlined">shopping_cart</span> Orders
            </a>
            <a class="text-slate-600 px-4 py-3 flex items-center gap-3 hover:bg-slate-100 rounded-lg"
                href="<?= getPageUrl('employees') ?>">
                <span class="material-symbols-outlined">badge</span> Employees
            </a>
        </nav>
    </aside>

    <main class="md:pl-64 pt-8 px-8">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-4xl font-black tracking-tight">Order Management</h1>
                    <p class="text-slate-500">Track and manage your customer transactions in real-time.</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500">Order ID</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500">Customer</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-right">Total</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-center">Status</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase text-slate-500 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="order-list">
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-slate-400">Loading order data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9eGV7dXzy0e-mTuMdC0Lv98zlfGOyvIDX0Q7zNk3ftCj__nIhuEuVBkgp3MklkEbW/exec";

        async function loadOrders() {
            const list = document.getElementById('order-list');
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getOrders`);
                const json = await res.json();
                const orders = json.data || [];

                list.innerHTML = '';
                if (orders.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="py-10 text-center">No orders found.</td></tr>';
                    return;
                }

                orders.forEach(o => {
                    const status = (o.Status || "New").toLowerCase();
                    const statusClass = status.includes("new") ? "bg-orange-100 text-orange-600" : (status.includes("contact") ? "bg-orange-100 text-orange-700" : "bg-green-100 text-green-700");

                    list.innerHTML += `
                        <tr class="border-b hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs font-bold text-slate-400">${o.Order_ID || o.id}</td>
                            <td class="px-6 py-4 font-bold">${o.Customer_Name || o.customerName}</td>
                            <td class="px-6 py-4 text-right font-bold text-orange-600">₹${o.Total_Amount || o.totalAmount}</td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-2 py-1 rounded-full text-[11px] font-black uppercase ${statusClass}">
                                    ${o.Status || o.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-slate-400 hover:text-orange-500 transition-colors">
                                    <span class="material-symbols-outlined text-[18px]">visibility</span>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                list.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-red-500 font-bold">Failed to load system data.</td></tr>';
            }
        }
        window.onload = loadOrders;
    </script>
</body>

</html>
